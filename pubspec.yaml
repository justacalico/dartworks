name: dartworks
description: "2D physics demake of BONEWORKS in Flutter. Fan project, not for production."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_forge2d: ^0.20.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flame_test: ^2.3.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  linux: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/icon/icon.png
  fonts:
    - family: Oxanium
      fonts:
        - asset: assets/fonts/Oxanium-400.ttf
          weight: 400
        - asset: assets/fonts/Oxanium-600.ttf
          weight: 600
        - asset: assets/fonts/Oxanium-800.ttf
          weight: 800
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
          weight: 400
