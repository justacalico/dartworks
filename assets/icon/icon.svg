<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12101A"/>
      <stop offset="1" stop-color="#07060B"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDEBF5"/>
      <stop offset="1" stop-color="#9B94B8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- glitch scanlines -->
  <g opacity="0.08" fill="#4DE8FF">
    <rect x="0" y="180" width="1024" height="3"/>
    <rect x="0" y="340" width="1024" height="2"/>
    <rect x="0" y="520" width="1024" height="4"/>
    <rect x="0" y="700" width="1024" height="2"/>
    <rect x="0" y="840" width="1024" height="3"/>
  </g>

  <!-- bone shape: horizontal bone with knobs at both ends -->
  <g filter="url(#glow)">
    <!-- cyan glitch offset -->
    <g transform="translate(-8,0)" opacity="0.5" fill="#4DE8FF">
      <circle cx="250" cy="430" r="85"/>
      <circle cx="250" cy="594" r="85"/>
      <circle cx="774" cy="430" r="85"/>
      <circle cx="774" cy="594" r="85"/>
      <rect x="250" y="470" width="524" height="84" rx="42"/>
    </g>
    <!-- purple glitch offset -->
    <g transform="translate(8,0)" opacity="0.5" fill="#B44DFF">
      <circle cx="250" cy="430" r="85"/>
      <circle cx="250" cy="594" r="85"/>
      <circle cx="774" cy="430" r="85"/>
      <circle cx="774" cy="594" r="85"/>
      <rect x="250" y="470" width="524" height="84" rx="42"/>
    </g>
    <!-- main bone -->
    <g fill="url(#bone)">
      <circle cx="250" cy="430" r="85"/>
      <circle cx="250" cy="594" r="85"/>
      <circle cx="774" cy="430" r="85"/>
      <circle cx="774" cy="594" r="85"/>
      <rect x="250" y="470" width="524" height="84" rx="42"/>
    </g>
  </g>

  <!-- crack/split through bone -->
  <g stroke="#FF4D5E" stroke-width="6" fill="none" opacity="0.7">
    <path d="M 512 380 L 498 440 L 524 488 L 500 540 L 520 600"/>
  </g>

  <!-- monogon yellow accent dot -->
  <circle cx="512" cy="512" r="14" fill="#F2C230"/>
</svg>
